#  Flare Tokens · menu 'tokens' (/tokens menu)
#  In-game: /tokens editor tokens   (drag & drop · close = save)
#
#  enabled         false = menu off for everyone
#  rows            size of the menu: 1-6 rows (9-54 slots)
#  open-commands   [wallet] → /wallet opens it   ·   open-permission: "" = everyone
#  slots           "4"  "19-25"  "0-8,45-53"   (row 1 = 0-8, row 2 = 9-17 ...)
#  material        DIAMOND · head:{player} · head:Notch · texture:<minecraft-heads value>
#  admin-only      true = players don't see it
#  actions         [close] [back] [open] <menu> [player] cmd [console] cmd [message] text [sound] key
#  Placeholders   {player} {tokens} {tokens_formatted} {tokens_commas} and PlaceholderAPI
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#b57bffText"   Gradient "<gradient:#8e2de2:#c471f5>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

enabled: true
title: "<gradient:#8e2de2:#c471f5><bold>TOKENS</bold></gradient>"
rows: 3
open-commands: []
open-permission: ""
elements:
  balance:
    slots: "10"
    admin-only: false
    material: "head:{player}"
    name: "&f{player}"
    lore:
      - "&7Balance: &#b57bff{tokens_commas} tokens"
      - ""
      - "&7Spend them in the shop!"
    update: true
  shop:
    slots: "12"
    admin-only: false
    material: "EMERALD"
    name: "&#b57bffShop"
    lore:
      - "&7Ranks, items and more"
      - ""
      - "&#b57bffClick to open"
  top:
    slots: "14"
    admin-only: false
    material: "KNOWLEDGE_BOOK"
    name: "&#b57bffTop players"
    lore:
      - "&7Who has the most tokens"
      - ""
      - "&#b57bffClick to open"
  history:
    slots: "16"
    admin-only: false
    material: "WRITABLE_BOOK"
    name: "&#b57bffHistory"
    lore:
      - "&7Every token you got and spent"
      - ""
      - "&#b57bffClick to open"
  close:
    slots: "22"
    admin-only: false
    material: "BARRIER"
    name: "&cClose"
    lore: []
decorations:
  - slots: "0-9,17-21,23-26"
    material: "PURPLE_STAINED_GLASS_PANE"
    name: " "
    lore: []
    glow: false
    admin-only: false
    actions: []
