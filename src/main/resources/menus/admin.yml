#  Flare Tokens · texts of the admin menus (/tokens settings and the editor)
#  Player menu texts are in menus/*.yml and shops/*.yml (section "texts")
#  Chat messages are in lang/en.yml   ·   after editing: /tokens reload
#  Placeholders {value} {menu} ... are filled by the plugin, keep them.
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#b57bffText"
#  Gradient  "<gradient:#8e2de2:#c471f5>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

